<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ77 — রেজিস্ট্রেশন</title>
<style>
:root{--gold:#ffc94b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#000;color:#222}
header{background:#1565c0;padding:18px;text-align:center;border-bottom:1px solid #0d47a1}
.logo{font-weight:1000;font-size:38px;letter-spacing:-2px;color:#f6ad00;text-shadow:1px 2px 0 #8b3900,0 0 8px #ffd45b}
main{max-width:430px;margin:26px auto;padding:0 16px}.card{background:#1565c0;border:1px solid #64b5f6;border-radius:18px;padding:24px 20px}
h1{text-align:center;margin:0 0 8px;font-size:25px;color:#fff}.sub{text-align:center;color:#e3f2fd;font-size:14px;margin:0 0 24px}
label{display:block;font-size:14px;font-weight:700;color:#fff;margin:15px 0 7px}
input{width:100%;padding:14px;border:1px solid #cbd2d7;border-radius:10px;font-size:16px}
input:focus{outline:2px solid #ffc94b}button{width:100%;margin-top:22px;border:0;border-radius:28px;padding:14px;background:linear-gradient(100deg,#fff36b,#ffbd3e);font-size:18px;font-weight:800;color:#332600;cursor:pointer}
.links{text-align:center;margin-top:16px;font-size:14px}a{color:#fff3b0;text-decoration:none}
.notice{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fff5d8;color:#674900;font-size:13px}
.note{font-size:12px;color:#c7d2da;text-align:center;margin:20px 4px;line-height:1.6}
</style></head><body>
<header><div class="logo">DJ77</div></header><main><section class="card">
<h1>নতুন অ্যাকাউন্ট খুলুন</h1><p class="sub">DJ77-এ যোগ দিতে তথ্য দিন</p>
<form id="registerForm">
<label for="newUsername">মোবাইল নম্বর / ইউজারনেম</label><input id="newUsername" required autocomplete="username" placeholder="আপনার মোবাইল নম্বর বা ইউজারনেম">
<label for="newPassword">পাসওয়ার্ড</label><input id="newPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="কমপক্ষে ৬ অক্ষর">
<label for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label><input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="আবার পাসওয়ার্ড লিখুন">
<button type="submit">রেজিস্ট্রেশন</button><div class="notice" id="notice" role="alert"></div>
</form><div class="links"><a href="index.html">আগে থেকেই অ্যাকাউন্ট আছে? লগইন করুন</a></div>
</section><p class="note">এটি ব্রাউজারভিত্তিক ডেমো। অ্যাকাউন্ট শুধু এই ডিভাইস ও ব্রাউজারে সংরক্ষিত থাকবে। নিরাপদ ও বহু-ডিভাইস অ্যাকাউন্টের জন্য সার্ভার ও ডেটাবেস দরকার।</p></main>
<script>
const KEY='dj77_demo_account';
const form=document.getElementById('registerForm'), notice=document.getElementById('notice');
function show(message){notice.textContent=message;notice.style.display='block';}
form.addEventListener('submit',function(e){
 e.preventDefault();
 const username=document.getElementById('newUsername').value.trim();
 const password=document.getElementById('newPassword').value;
 const confirm=document.getElementById('confirmPassword').value;
 if(!username){show('ইউজারনেম লিখুন।');return;}
 if(password.length<6){show('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।');return;}
 if(password!==confirm){show('দুটি পাসওয়ার্ড মিলছে না।');return;}
 try{
  const existing=localStorage.getItem(KEY);
  if(existing){show('এই ব্রাউজারে একটি অ্যাকাউন্ট আগে থেকেই আছে। সেই অ্যাকাউন্ট দিয়ে লগইন করুন।');return;}
  localStorage.setItem(KEY,JSON.stringify({username:username,password:password}));
  show('রেজিস্ট্রেশন সম্পন্ন! লগইন পেজে নেওয়া হচ্ছে…');
  setTimeout(()=>location.href='index.html',900);
 }catch(err){show('এই ব্রাউজারে তথ্য সংরক্ষণ করা যাচ্ছে না। ব্রাউজারের স্টোরেজ সেটিংস পরীক্ষা করুন।');}
});
</script></body></html>
