<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ77 — লগইন</title>
<style>
:root{--gold:#ffc94b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#000;color:#222}
header{background:#1565c0;padding:18px 16px;border-bottom:1px solid #0d47a1;display:flex;align-items:center;justify-content:center}
.logo{font-weight:1000;font-size:38px;letter-spacing:-2px;color:#f6ad00;text-shadow:1px 2px 0 #8b3900,0 0 8px #ffd45b}
main{max-width:430px;margin:26px auto;padding:0 16px}.card{background:#1565c0;border:1px solid #64b5f6;border-radius:18px;padding:24px 20px;box-shadow:0 8px 24px #0000000b}
h1{text-align:center;margin:0 0 8px;font-size:25px;color:#fff}.sub{text-align:center;color:#e3f2fd;font-size:14px;margin:0 0 24px}
label{display:block;font-size:14px;font-weight:700;color:#fff;margin:15px 0 7px}
input{width:100%;padding:14px;border:1px solid #cbd2d7;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:#eeb52e;box-shadow:0 0 0 3px #ffc94b33}
button{width:100%;margin-top:22px;border:0;border-radius:28px;padding:14px;background:linear-gradient(100deg,#fff36b,#ffbd3e);font-size:18px;font-weight:800;color:#332600;cursor:pointer}
.links{display:flex;justify-content:center;gap:10px;margin-top:16px;font-size:14px}
a{color:#fff3b0;text-decoration:none}.note{font-size:12px;color:#c7d2da;text-align:center;margin:22px 4px 0;line-height:1.6}
.notice{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fff5d8;color:#674900;font-size:13px}
</style></head><body>
<header><div class="logo">DJ77</div></header><main><section class="card">
<h1>লগইন করুন</h1><p class="sub">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
<form id="loginForm">
<label for="username">মোবাইল নম্বর / ইউজারনেম</label><input id="username" name="username" autocomplete="username" placeholder="আপনার মোবাইল নম্বর বা ইউজারনেম" required>
<label for="password">পাসওয়ার্ড</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড লিখুন" required>
<button type="submit">লগইন</button><div class="notice" id="notice" role="alert"></div>
</form><div class="links"><a href="dj77-register.html">নতুন অ্যাকাউন্ট খুলুন</a></div>
</section><p class="note">এটি ব্রাউজারভিত্তিক ডেমো। অ্যাকাউন্ট একই ডিভাইস ও ব্রাউজারে কাজ করবে। বাস্তব নিরাপদ লগইনের জন্য সার্ভার ও ডেটাবেস দরকার।</p></main>
<script>
const KEY='dj77_demo_account';
const form=document.getElementById('loginForm'),notice=document.getElementById('notice');
function show(message){notice.textContent=message;notice.style.display='block';}
form.addEventListener('submit',function(e){
 e.preventDefault();
 const username=document.getElementById('username').value.trim();
 const password=document.getElementById('password').value;
 if(!username||!password)return;
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw){show('এই ব্রাউজারে অ্যাকাউন্ট পাওয়া যায়নি। আগে রেজিস্ট্রেশন করুন।');return;}
  const saved=JSON.parse(raw);
  if(!saved||typeof saved.username!=='string'||typeof saved.password!=='string'){show('অ্যাকাউন্টের সংরক্ষিত তথ্য ঠিক নেই। আবার রেজিস্ট্রেশন করতে হবে।');return;}
  if(saved.username.trim().toLowerCase()!==username.toLowerCase()||saved.password!==password){show('ইউজারনেম বা পাসওয়ার্ড সঠিক নয়। রেজিস্ট্রেশনের সময় দেওয়া তথ্য ব্যবহার করুন।');return;}
  sessionStorage.setItem('dj77_logged_in','yes');
  location.href='dj77-homepage.html';
 }catch(err){show('অ্যাকাউন্টের তথ্য পড়া যাচ্ছে না। একই ব্রাউজারে আবার চেষ্টা করুন।');}
});
</script></body></html>
